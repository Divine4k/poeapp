name: Build installer

# Builds the Windows installer and publishes it as a GitHub release.
# Runs when the "release" branch is pushed, or by hand from the Actions tab.
# To publish a new installer: push the commit you want to the release branch.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Record the version being packaged
        shell: bash
        run: |
          node -e "const cp=require('child_process');const sha=cp.execSync('git rev-parse HEAD').toString().trim();const message=cp.execSync('git log -1 --format=%s').toString().trim();const date=cp.execSync('git log -1 --format=%cI').toString().trim();require('fs').writeFileSync('.version',JSON.stringify({sha,message,date}));"
          cat .version
      - name: Build the installer
        run: npx --yes electron-builder@25 --win nsis --x64 --publish never
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          # A version that was already released gets the build number added, so nothing is overwritten.
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" dist/MapCompanion-Setup.exe --target "$GITHUB_SHA" --title "Map Companion installer ($TAG)" --notes "Download MapCompanion-Setup.exe and run it. You can choose where to install. Later updates arrive inside the app." --latest
